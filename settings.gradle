pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'FBR-to-World'

include 'mc-1.21.11'
include 'mc-26.2'

project(':mc-1.21.11').projectDir = file('versions/1.21.11')
project(':mc-26.2').projectDir = file('versions/26.2')
